name: CI

# The studio gate, mirrored in CI: lint (zero warnings) → test → build (type-checks + bundles).
# Runs on every push and PR so no defect reaches main without clearing the same bar the
# local Definition of Done requires.

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint (eslint — zero warnings)
        run: npm run lint
      - name: Test (Vitest — financial engine + a11y + design-system guards)
        run: npm test
      - name: Build (Astro — type-checks and bundles)
        run: npm run build
